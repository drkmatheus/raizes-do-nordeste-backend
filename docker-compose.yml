services:
  db:
    image: postgres:16-alpine
    container_name: raizes_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raizes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raizes123}
      POSTGRES_DB: ${POSTGRES_DB:-raizes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raizes} -d ${POSTGRES_DB:-raizes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: raizes_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # pre-cadastra o servidor "Raizes do Nordeste" (so na primeira subida do volume)
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
